name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') }}

    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          passphrase: ${{ secrets.ORACLE_SSH_PASSPHRASE }}
          script: |
            source ~/.bashrc 2>/dev/null || true
            source ~/.profile 2>/dev/null || true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node 2>/dev/null | tail -n 1)/bin:$PATH"
            if [ ! -d ~/banknifty-ironcondor ]; then
              git clone https://github.com/kunalrbhatia/banknifty-ironcondor.git ~/banknifty-ironcondor
            fi
            cd ~/banknifty-ironcondor
            git reset --hard
            git clean -fd
            git fetch origin
            git checkout main 2>/dev/null || git checkout master
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
            pnpm install --no-frozen-lockfile --ignore-scripts
            pnpm exec tsc
            if command -v pm2 &> /dev/null; then
              pm2 restart ecosystem.config.cjs --env production 2>/dev/null || pm2 start ecosystem.config.cjs --env production
            else
              npx pm2 restart ecosystem.config.cjs --env production 2>/dev/null || npx pm2 start ecosystem.config.cjs --env production
            fi
